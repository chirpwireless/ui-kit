name: Publish

on:
    workflow_dispatch:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "yarn"
            - name: Install yarn dependencies
              run: yarn install --frozen-lockfile
            - name: Run build
              run: yarn build
            # The version lives in tags only: main is protected and nothing commits to it.
            - name: Next version
              id: version
              run: |
                  last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
                  if [[ ! $last =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                      echo "no vX.Y.Z tag to bump from" >&2
                      exit 1
                  fi
                  echo "next=${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0" >> "$GITHUB_OUTPUT"
            # Tag and release first: a failed publish then leaves a gap, not a version that every next run collides with.
            - name: Tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
                  NEXT: ${{ steps.version.outputs.next }}
              run: gh release create "v$NEXT" --target "$GITHUB_SHA" --generate-notes
            - name: Publish package
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NEXT: ${{ steps.version.outputs.next }}
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
                  yarn publish --new-version "$NEXT" --no-git-tag-version --non-interactive
